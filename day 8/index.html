<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Confirmation System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/custom.bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- Registration Form Section -->
                <div id="formSection" class="card shadow border-0">
                    <div class="card-header text-white p-4">
                        <h2 class="mb-0"><i class="fa-solid fa-user-plus me-2"></i>Student Registration</h2>
                        <small class="text-light-50">Please fill out all fields below to register</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="registrationForm">
                            
                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>

                            <!-- UPGRADE: Student Photo Upload UI (No server upload needed) -->
                            <div class="mb-3">
                                <label for="photoUpload" class="form-label fw-bold">Student Photo</label>
                                <input class="form-control" type="file" id="photoUpload" accept="image/*">
                                <div class="form-text text-muted">Upload a portrait image for your profile card.</div>
                            </div>

                            <!-- UPGRADE: Gender (Radios) -->
                            <div class="mb-3">
                                <label class="form-label d-block fw-bold">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Male" checked>
                                    <label class="form-check-label" for="genderMale">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Female">
                                    <label class="form-check-label" for="genderFemale">Female</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="Other">
                                    <label class="form-check-label" for="genderOther">Other</label>
                                </div>
                            </div>

                            <!-- UPGRADE: Course (Dropdown) -->
                            <div class="mb-3">
                                <label for="course" class="form-label fw-bold">Select Course</label>
                                <select class="form-select" id="course" required>
                                    <option value="" disabled selected>Choose a course...</option>
                                    <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Data Science & AI">Data Science & AI</option>
                                    <option value="Business Administration">Business Administration</option>
                                </select>
                            </div>

                            <!-- UPGRADE: Address (Textarea) -->
                            <div class="mb-4">
                                <label for="address" class="form-label fw-bold">Residential Address</label>
                                <textarea class="form-control" id="address" rows="3" placeholder="Enter your full address here..." required></textarea>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">
                                    <i class="fa-solid fa-paper-plane me-2"></i>Submit Registration
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- UPGRADE: Better Bootstrap Design - Confirmation Page Template (Hidden by default) -->
                <div id="confirmationSection" class="card shadow border-0 d-none">
                    <!-- Gradient Header -->
                    <div class="confirmation-header text-center text-white p-5 rounded-top">
                        <div class="display-4 mb-2"><i class="fa-solid fa-circle-check text-white bounce-icon"></i></div>
                        <h2 class="fw-bold">Registration Complete!</h2>
                        <span class="badge bg-success-light text-success px-3 py-2 mt-2 rounded-pill fw-bold">
                            <i class="fa-solid fa-shield-halved me-1"></i> Verified Submission
                        </span>
                    </div>

                    <div class="card-body p-5">
                        <div class="row align-items-center">
                            <!-- Left Column: Photo Placeholder UI -->
                            <div class="col-md-4 text-center mb-4 mb-md-0">
                                <div class="avatar-wrapper mx-auto shadow-sm p-2 bg-white rounded-circle">
                                    <img id="confPhoto" src="https://via.placeholder.com/150?text=Student+Photo" alt="Student Photo" class="img-fluid rounded-circle object-fit-cover w-100 h-100">
                                </div>
                            </div>
                            
                            <!-- Right Column: Student Details -->
                            <div class="col-md-8">
                                <h3 id="confName" class="text-primary fw-bold mb-1">John Doe</h3>
                                <p id="confCourse" class="text-muted fw-semibold mb-4"><i class="fa-solid fa-graduation-cap me-2"></i>Course Name</p>
                                
                                <hr class="text-muted opacity-25">

                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <small class="text-uppercase text-muted d-block fw-bold tracking-wider">Email</small>
                                        <span id="confEmail" class="text-dark">name@example.com</span>
                                    </div>
                                    <div class="col-sm-6">
                                        <small class="text-uppercase text-muted d-block fw-bold tracking-wider">Gender</small>
                                        <span id="confGender" class="badge bg-secondary rounded-pill px-3 py-1 mt-1">Male</span>
                                    </div>
                                    <div class="col-12 mt-3">
                                        <small class="text-uppercase text-muted d-block fw-bold tracking-wider">Address</small>
                                        <p id="confAddress" class="text-dark bg-light p-3 rounded border-start border-primary border-3 mb-0">123 Street Address</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-5">
                            <button id="backBtn" class="btn btn-outline-secondary px-4 fw-bold">
                                <i class="fa-solid fa-arrow-left me-2"></i>Register Another Student
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Custom Script JS -->
    <script src="script.js"></script>
</body>
</html>
