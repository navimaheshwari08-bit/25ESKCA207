<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background: #f4f6f9; min-height: 100vh; display: flex; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-6 col-lg-5">
                
                <!-- REQUIRED FEATURE: Forgot Password Interface Container -->
                <div class="card shadow border-0 p-4">
                    <div class="text-center p-3">
                        <div class="bg-light d-inline-block p-3 rounded-circle text-primary mb-3">
                            <i class="fa-solid fa-lock-open fa-2xl"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Forgot Password?</h3>
                        <p class="text-muted small">Enter your email credentials below and we will distribute a validation tracking sequence.</p>
                    </div>

                    <!-- Confirmation UI Message Wrapper (Hidden initially) -->
                    <div id="confirmationMessage" class="alert alert-success d-none border-0 shadow-sm" role="alert">
                        <div class="d-flex">
                            <i class="fa-solid fa-envelope-circle-check fa-xl me-3 mt-1"></i>
                            <div>
                                <h6 class="alert-heading fw-bold mb-1">Recovery Link Dispatched!</h6>
                                <p class="mb-0 small text-secondary">If an identity matching <strong id="targetEmail"></strong> is recorded, validation criteria will arrive momentarily.</p>
                            </div>
                        </div>
                    </div>

                    <form id="forgotPasswordForm">
                        <div class="mb-4">
                            <label for="recoveryEmail" class="form-label fw-semibold small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                                <input type="email" id="recoveryEmail" class="form-control border-start-0 ps-0" placeholder="yourname@domain.com" required>
                            </div>
                        </div>
                        <div class="d-grid mb-2">
                            <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm">Send Password Reset Link</button>
                        </div>
                        <div class="text-center mt-3">
                            <a href="#" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- UI Interaction Script Logic -->
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('recoveryEmail').value;
            
            // Populate display context string safely
            document.getElementById('targetEmail').innerText = emailInput;
            
            // Visual DOM swap sequence per assignment expectations
            document.getElementById('confirmationMessage').classList.remove('d-none');
            this.reset();
        });
    </script>
</body>
</html>
